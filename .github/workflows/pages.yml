name: Publish PWA
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check application and core behavior
        run: |
          node --check app.js
          node --check db.js
          node --check logic.js
          node --check sw.js
          node --test tests/logic.test.js
      - name: Prepare public files only
        run: |
          mkdir -p _site/icons
          cp index.html style.css app.js db.js logic.js sw.js manifest.webmanifest _site/
          cp icons/*.png _site/icons/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
